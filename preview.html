<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icons</title>
<style>
:root { color-scheme: dark; --bg:#0b0f17; --panel:#141a25; --line:#263041; --text:#f4f7ff; --muted:#94a3b8; --accent:#60a5fa; }
* { box-sizing:border-box; }
body { margin:0; padding:28px; background:var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; }
header { max-width:1280px; margin:0 auto 22px; display:flex; align-items:end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
h1 { margin:0; font-size:20px; letter-spacing:.2px; }
p { margin:4px 0 0; color:var(--muted); }
.toolbar { display:flex; gap:14px; flex-wrap:wrap; }
.controls { display:flex; gap:6px; flex-wrap:wrap; }
button { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:7px; padding:7px 12px; cursor:pointer; }
button.active { border-color:var(--accent); background:#1d2b42; color:#fff; }
.grid { max-width:1280px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.card { min-height:132px; padding:14px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); display:flex; flex-direction:column; align-items:center; text-align:center; }
.card img { width:56px; height:56px; object-fit:contain; image-rendering:auto; outline:1px dashed rgba(203,213,225,.22); }
.name { margin-top:8px; font-weight:600; word-break:break-word; }
.tags { margin-top:6px; display:flex; flex-wrap:wrap; justify-content:center; gap:4px; }
.tag { color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 7px; font-size:11px; }
</style>
</head>
<body>
<header>
  <div><h1>Icons</h1><p><span id="count"></span> icons · 图标 / 名字 / tags</p></div>
  <div class="toolbar">
    <div class="controls" role="group" aria-label="图标分类">
      <button type="button" data-category="all" class="active" aria-pressed="true">全部</button>
      <button type="button" data-category="programming" aria-pressed="false">编程语言</button>
      <button type="button" data-category="other" aria-pressed="false">其他</button>
    </div>
    <div class="controls" role="group" aria-label="图标配色">
      <button type="button" data-variant="color" class="active" aria-pressed="true">彩色</button>
      <button type="button" data-variant="mono" aria-pressed="false">无色</button>
    </div>
  </div>
</header>
<main id="grid" class="grid"></main>

}, {"name": "room", "tags": ["room", "interior", "space", "房间", "室内"]}, {"name": "rug", "tags": ["rug", "carpet", "textile", "地毯"]}, {"name": "rust", "tags": ["languages", "rust", "编程语言"]}, {"name": "save", "tags": ["disk", "save", "store", "write"]}, {"name": "scene-tree", "tags": ["entities", "hierarchy", "scene", "tree"]}, {"name": "search", "tags": ["filter", "find", "magnifier", "search"]}, {"name": "shader", "tags": ["graphics", "shader", "编程语言"]}, {"name": "shadow", "tags": ["light", "render", "shadow", "shadows"]}, {"name": "shower", "tags": ["shower", "bathroom", "花洒", "卫浴"]}, {"name": "sofa", "tags": ["sofa", "couch", "furniture", "沙发"]}, {"name": "square", "tags": ["box", "brush", "shape", "square"]}, {"name": "star", "tags": ["star", "night", "sky", "星星", "星"]}, {"name": "sun", "tags": ["sun", "sunshine", "weather", "太阳", "阳光"]}, {"name": "table", "tags": ["table", "desk", "furniture", "桌子", "书桌"]}, {"name": "tag", "tags": ["category", "label", "marker", "tag"]}, {"name": "terminal", "tags": ["terminal", "tools", "编程语言"]}, {"name": "toilet", "tags": ["toilet", "bathroom", "马桶", "卫浴"]}, {"name": "toml", "tags": ["data", "toml"]}, {"name": "tools", "tags": ["tool", "tools", "utilities", "wrench"]}, {"name": "tree", "tags": ["tree", "wood", "forest", "nature", "树木", "树"]}, {"name": "typescript", "tags": ["languages", "typescript", "编程语言"]}, {"name": "video", "tags": ["files", "video"]}, {"name": "viewport", "tags": ["camera", "preview", "render", "viewport", "window"]}, {"name": "wall", "tags": ["wall", "brick", "structure", "墙", "墙壁", "砖墙"]}, {"name": "warning", "tags": ["alert", "caution", "error", "warning"]}, {"name": "water", "tags": ["water", "drop", "liquid", "水", "水滴"]}, {"name": "window", "tags": ["window", "window frame", "interior", "窗", "窗户"]}, {"name": "yaml", "tags": ["data", "yaml"]}];
let variant = "color";
let category = "all";
const programmingTag = "编程语言";
const grid = document.getElementById("grid");
const count = document.getElementById("count");
function render() {
  const visible = icons.filter(icon => category === "all" ||
    (category === "programming" ? icon.tags.includes(programmingTag) : !icon.tags.includes(programmingTag)));
  count.textContent = category === "all" ? icons.length : `${visible.length} / ${icons.length}`;
  grid.innerHTML = visible.map(icon => {
    const dir = variant === "color" ? "svg-bare" : "svg-mono";
    const tags = icon.tags.map(tag => `<span class="tag">${tag}</span>`).join("");
    return `<article class="card"><img loading="lazy" src="${dir}/${icon.name}.svg" alt="${icon.name}"><div class="name">${icon.name}</div><div class="tags">${tags}</div></article>`;
  }).join("");
  document.querySelectorAll("button[data-variant]").forEach(button => {
    const active = button.dataset.variant === variant;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
  document.querySelectorAll("button[data-category]").forEach(button => {
    const active = button.dataset.category === category;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}
document.querySelectorAll("button[data-variant]").forEach(button => {
  button.addEventListener("click", () => { variant = button.dataset.variant; render(); });
});
document.querySelectorAll("button[data-category]").forEach(button => {
  button.addEventListener("click", () => { category = button.dataset.category; render(); });
});
render();
</script>

</html>
