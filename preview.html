<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icons</title>
<style>
:root { color-scheme: dark; --bg:#0b0f17; --panel:#141a25; --line:#263041; --text:#f4f7ff; --muted:#94a3b8; --accent:#60a5fa; }
* { box-sizing:border-box; }
body { margin:0; padding:28px; background:var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; }
header { max-width:1280px; margin:0 auto 22px; display:flex; align-items:end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
h1 { margin:0; font-size:20px; letter-spacing:.2px; }
p { margin:4px 0 0; color:var(--muted); }
.controls { display:flex; gap:6px; }
button { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:7px; padding:7px 12px; cursor:pointer; }
button.active { border-color:var(--accent); background:#1d2b42; color:#fff; }
.grid { max-width:1280px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.card { min-height:132px; padding:14px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); display:flex; flex-direction:column; align-items:center; text-align:center; }
.card img { width:56px; height:56px; object-fit:contain; image-rendering:auto; }
.name { margin-top:8px; font-weight:600; word-break:break-word; }
.tags { margin-top:6px; display:flex; flex-wrap:wrap; justify-content:center; gap:4px; }
.tag { color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 7px; font-size:11px; }
</style>
</head>
<body>
<header>
  <div><h1>Icons</h1><p><span id="count"></span> icons · 图标 / 名字 / tags</p></div>
  <div class="controls">
    <button type="button" data-variant="color" class="active">彩色</button>
    <button type="button" data-variant="mono">无色</button>
  </div>
</header>
<main id="grid" class="grid"></main>
<script>
const icons = [{"name": "add", "tags": ["add", "create", "new", "plus"]}, {"name": "audio", "tags": ["audio", "files"]}, {"name": "boundary", "tags": ["boundary", "edge", "outline", "terrain"]}, {"name": "brush", "tags": ["brush", "paint", "stroke", "tool"]}, {"name": "c", "tags": ["c", "languages"]}, {"name": "circle", "tags": ["brush", "circle", "round", "shape"]}, {"name": "close", "tags": ["cancel", "close", "dismiss", "x"]}, {"name": "code", "tags": ["code", "source code", "tools"]}, {"name": "config", "tags": ["config", "configuration", "tools"]}, {"name": "cpp", "tags": ["c++", "cpp", "languages"]}, {"name": "csharp", "tags": ["c#", "csharp", "languages"]}, {"name": "css", "tags": ["css", "web"]}, {"name": "database", "tags": ["database", "tools"]}, {"name": "docker", "tags": ["docker", "tools"]}, {"name": "document", "tags": ["document", "files"]}, {"name": "eye-off", "tags": ["eye", "hidden", "hide", "invisible", "off"]}, {"name": "eye", "tags": ["eye", "show", "view", "visible"]}, {"name": "file", "tags": ["document", "file", "generic", "page"]}, {"name": "folder-open", "tags": ["directory", "folder", "open"]}, {"name": "folder", "tags": ["files", "folder"]}, {"name": "game-engine", "tags": ["engine", "game", "game engine", "tools"]}, {"name": "git", "tags": ["git", "tools"]}, {"name": "grass", "tags": ["field", "grass", "paint", "terrain", "vegetation"]}, {"name": "ground", "tags": ["ground", "layers", "surface", "terrain"]}, {"name": "height", "tags": ["height", "landscape", "lower", "raise", "sculpt", "terrain"]}, {"name": "html", "tags": ["html", "web"]}, {"name": "image", "tags": ["files", "image"]}, {"name": "inspector", "tags": ["fields", "inspector", "properties", "settings", "sliders"]}, {"name": "javascript", "tags": ["javascript", "languages"]}, {"name": "json", "tags": ["data", "json"]}, {"name": "markdown", "tags": ["data", "markdown"]}, {"name": "mini-map", "tags": ["map", "mini", "minimap", "navigation", "overview"]}, {"name": "model-3d", "tags": ["3d", "3d model", "files", "model"]}, {"name": "node", "tags": ["frameworks", "node", "node.js"]}, {"name": "objects", "tags": ["cube", "object", "objects", "prop", "scene"]}, {"name": "package", "tags": ["package", "tools"]}, {"name": "physics", "tags": ["body", "collision", "physics", "simulation"]}, {"name": "post-processing", "tags": ["bloom", "effects", "post", "processing", "render"]}, {"name": "python", "tags": ["languages", "python"]}, {"name": "react", "tags": ["frameworks", "react"]}, {"name": "remove", "tags": ["delete", "minus", "remove"]}, {"name": "rust", "tags": ["languages", "rust"]}, {"name": "save", "tags": ["disk", "save", "store", "write"]}, {"name": "scene-tree", "tags": ["entities", "hierarchy", "scene", "tree"]}, {"name": "search", "tags": ["filter", "find", "magnifier", "search"]}, {"name": "settings", "tags": ["gear", "options", "preferences", "settings"]}, {"name": "shader", "tags": ["graphics", "shader"]}, {"name": "shadow", "tags": ["light", "render", "shadow", "shadows"]}, {"name": "square", "tags": ["box", "brush", "shape", "square"]}, {"name": "tag", "tags": ["category", "label", "marker", "tag"]}, {"name": "terminal", "tags": ["terminal", "tools"]}, {"name": "toml", "tags": ["data", "toml"]}, {"name": "tools", "tags": ["tool", "tools", "utilities", "wrench"]}, {"name": "typescript", "tags": ["languages", "typescript"]}, {"name": "video", "tags": ["files", "video"]}, {"name": "viewport", "tags": ["camera", "preview", "render", "viewport", "window"]}, {"name": "warning", "tags": ["alert", "caution", "error", "warning"]}, {"name": "yaml", "tags": ["data", "yaml"]}];
let variant = "color";
const grid = document.getElementById("grid");
const count = document.getElementById("count");
function render() {
  count.textContent = icons.length;
  grid.innerHTML = icons.map(icon => {
    const dir = variant === "color" ? "svg-bare" : "svg-mono";
    const tags = icon.tags.map(tag => `<span class="tag">${tag}</span>`).join("");
    return `<article class="card"><img loading="lazy" src="${dir}/${icon.name}.svg" alt="${icon.name}"><div class="name">${icon.name}</div><div class="tags">${tags}</div></article>`;
  }).join("");
  document.querySelectorAll("button[data-variant]").forEach(button => {
    button.classList.toggle("active", button.dataset.variant === variant);
  });
}
document.querySelectorAll("button[data-variant]").forEach(button => {
  button.addEventListener("click", () => { variant = button.dataset.variant; render(); });
});
render();
</script>
</body>
</html>
